name: Docs Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install manual dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/manual/requirements.txt

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Build versioned docs site
      run: |
        set -euo pipefail
        git fetch --force --tags

        rm -rf _site
        mkdir -p _site/latest

        sphinx-build -b html docs/manual/source _site/latest

        mapfile -t TAGS < <(git tag --sort=-v:refname)
        for TAG in "${TAGS[@]}"; do
          WORKTREE_DIR="$(mktemp -d)"
          git worktree add --detach "$WORKTREE_DIR" "$TAG"

          if [ -f "$WORKTREE_DIR/docs/manual/source/conf.py" ]; then
            sphinx-build -b html "$WORKTREE_DIR/docs/manual/source" "_site/$TAG"
          fi

          git worktree remove "$WORKTREE_DIR" --force
        done

        python - <<'PY'
        import json
        import re
        from pathlib import Path

        site = Path("_site")
        versions = []
        if (site / "latest").is_dir():
            versions.append("latest")

        semver_dirs = [
            p.name
            for p in site.iterdir()
            if p.is_dir() and re.match(r"^v?\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$", p.name)
        ]

        def _key(version: str):
            clean = version[1:] if version.startswith("v") else version
            main = clean.split("-", 1)[0].split("+", 1)[0]
            parts = tuple(int(x) for x in main.split("."))
            return parts

        versions.extend(sorted(semver_dirs, key=_key, reverse=True))

        (site / "versions.json").write_text(json.dumps(versions, indent=2), encoding="utf-8")
        (site / "languages.json").write_text(json.dumps(["de"], indent=2), encoding="utf-8")
        (site / ".nojekyll").write_text("", encoding="utf-8")
        (site / "index.html").write_text(
            "<!doctype html>\n"
            "<html>\n"
            "  <head>\n"
            "    <meta charset=\"utf-8\" />\n"
            "    <meta http-equiv=\"refresh\" content=\"0; url=./latest/\" />\n"
            "    <title>EchoGTFS Docs</title>\n"
            "  </head>\n"
            "  <body>\n"
            "    <p>Redirecting to latest docs...</p>\n"
            "  </body>\n"
            "</html>\n",
            encoding="utf-8",
        )
        PY

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
