server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Block all /internal requests from host system
    location = /internal {
        return 404;
    }
    
    location ^~ /internal/ {
        return 404;
    }
    
    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for API responses to allow immediate SSE delivery
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering no;
    }

    # All other requests are served from the static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8080;
    server_name _;

    # /status and /api access are controlled by SIRI_STATUS_ENABLED.
    # SIRI_STATUS_ACCESS_BLOCK_START
    # SIRI_STATUS_ACCESS_BLOCK_END

    # Proxy all other paths to siricomservice.
    # The upstream is resolved lazily, as siricomservice only runs with the siripubsub profile.
    location / {
        resolver           127.0.0.11 valid=10s;
        set                $siri_upstream http://siricomservice:8080;
        proxy_pass         $siri_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}