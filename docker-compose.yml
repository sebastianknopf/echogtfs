services:

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgsqldata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(rs.status().ok === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1) }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  siricomservice:
    image: sebastianknopf/siriconsumer:0.3.0
    profiles:
      - siripubsub
    restart: unless-stopped
    volumes:
      - siricomservicedata:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${DEBUG:-false}
      TIMEZONE: ${TIMEZONE:-UTC}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/?replicaSet=rs0}
      MONGO_DATABASE: ${MONGO_DATABASE:-echogtfs}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      DATASOURCE_PROCESS_POOL_SIZE: ${DATASOURCE_PROCESS_POOL_SIZE:-2}
      GLOBAL_ID_PATTERN: ${GLOBAL_ID_PATTERN}
    command: "echogtfs"
    volumes:
      - datasourcelogs:/var/log/echogtfs/datasources
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${SIRI_PORT:-8080}:8080"
    environment:
      SIRI_STATUS_ENABLED: ${SIRI_STATUS_ENABLED:-false}
    depends_on:
      - backend

volumes:
  pgsqldata:
  redisdata:
  mongodata:
  siricomservicedata:
  datasourcelogs: